#
# Hosted pre-commit hooks. In .pre-commit-config.yaml:
#
#   repos:
#     - repo: https://github.com/sebastienrousseau/noya-cli
#       rev: v0.0.56
#       hooks:
#         - id: noyafmt
#         - id: noyavalidate
#
# The hooks build the binaries with cargo on first use (pre-commit's
# Rust language support), then run on the staged YAML files.
# pre-commit runs `cargo install` without `--locked`, so dependencies
# resolve to their newest compatible versions rather than this
# repository's Cargo.lock; for a locked build, install with
# `cargo install noya-cli --locked` and use a `repo: local` hook with
# `language: system` instead.
- id: noyafmt
  name: noyafmt (format YAML)
  description: Format YAML files in place with noyafmt; the hook fails when it changed a file.
  entry: noyafmt --write
  language: rust
  types: [yaml]
  minimum_pre_commit_version: "2.9.2"
- id: noyafmt-check
  name: noyafmt --check
  description: Fail if a YAML file is not already formatted.
  entry: noyafmt --check
  language: rust
  types: [yaml]
  minimum_pre_commit_version: "2.9.2"
- id: noyavalidate
  name: noyavalidate (parse YAML)
  description: Fail on any YAML file the parser refuses (every staged file is checked); pass --schema in args to validate against a JSON Schema.
  entry: noyavalidate
  language: rust
  types: [yaml]
  minimum_pre_commit_version: "2.9.2"

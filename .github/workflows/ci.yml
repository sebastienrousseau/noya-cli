name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  make-install:
    # Phase-2 install contract: the GNUmakefile must stage a correct
    # FHS tree under DESTDIR, the manpage must render, uninstall must
    # leave nothing behind, and the tracked manpages/completions must
    # be bit-identical to what the clap definitions generate
    # (check-assets), so the docs can never drift from --help again.
    name: make-install
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: make-install
      - name: Stage install and verify the tree
        run: |
          set -euo pipefail
          make DESTDIR="$PWD/stage" install
          for f in bin/noyafmt bin/noyavalidate                    share/man/man1/noyafmt.1 share/man/man1/noyavalidate.1                    share/bash-completion/completions/noyafmt                    share/zsh/site-functions/_noyafmt                    share/fish/vendor_completions.d/noyafmt.fish; do
            test -e "stage/usr/local/$f" || { echo "missing: $f" >&2; exit 1; }
          done
          stage/usr/local/bin/noyafmt --version
          man --local-file stage/usr/local/share/man/man1/noyafmt.1 | head -3
      - name: Uninstall leaves nothing
        run: |
          set -euo pipefail
          make DESTDIR="$PWD/stage" uninstall
          leftover=$(find stage -type f | wc -l)
          test "$leftover" = 0 || { find stage -type f; exit 1; }
      - name: Tracked assets match the clap definitions
        run: make check-assets
  docs-lint:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-docs-lint.yml@a1a2c8e4e48106dd099bc47e52680a9775d852be
  readme-examples:
    # Every ```rust block in README.md compiles against this crate.
    uses: sebastienrousseau/noyalib/.github/workflows/shared-readme-examples.yml@a1a2c8e4e48106dd099bc47e52680a9775d852be
  yaml-test-suite:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-yaml-test-suite.yml@4b0b9f502073b73784c6b12b8eaa9cce8e808a11
  cargo-deny:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-cargo-deny.yml@a1a2c8e4e48106dd099bc47e52680a9775d852be
  cargo-vet:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-cargo-vet.yml@a1a2c8e4e48106dd099bc47e52680a9775d852be
  cargo-machete:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-cargo-machete.yml@a1a2c8e4e48106dd099bc47e52680a9775d852be
  reuse-lint:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-reuse.yml@a1a2c8e4e48106dd099bc47e52680a9775d852be
  docs-strict:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-rustdoc-strict.yml@a1a2c8e4e48106dd099bc47e52680a9775d852be
  verify-signatures:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-verify-signatures.yml@a1a2c8e4e48106dd099bc47e52680a9775d852be
  test-matrix:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-test-matrix.yml@a1a2c8e4e48106dd099bc47e52680a9775d852be

  # ── A+ rigor parity with the core ──────────────────────────────────
  coverage-gate:
    # The reusable logic in `src/lib.rs` is at 100 %. Coverage is
    # measured at regions 91.4 / functions 100 / lines 89.6; the
    # residual gap is entirely defensive `Err(e) =>` arms in the two
    # binaries (parse/format failures that are unreachable because
    # Phase-1 `load_all_as` already validated syntax, plus stdin/stdout
    # I/O-failure arms). Forcing coverage on those is the assert-free-
    # test anti-pattern the project forbids, so the floor is set at the
    # honest testable ceiling — high enough to catch a real regression,
    # not so high it demands covering unreachable code.
    uses: sebastienrousseau/noyalib/.github/workflows/shared-coverage.yml@a1a2c8e4e48106dd099bc47e52680a9775d852be
    with:
      ignore-filename-regex: 'build\.rs$'
      fail-under-functions: 96
      fail-under-lines: 88
      fail-under-regions: 90

  msrv-core:
    # Verifies the declared 1.86.0 floor actually builds.
    uses: sebastienrousseau/noyalib/.github/workflows/shared-msrv-core.yml@a1a2c8e4e48106dd099bc47e52680a9775d852be
    with:
      toolchain: "1.86.0"

  fuzz-regression:
    # Every fuzz target builds on every push, and the seed corpus (plus
    # any fixed-bug regression inputs under fuzz/regressions/<target>/)
    # is replayed with -runs=0, so a fixed finding stays fixed.
    name: fuzz-regression
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ". -> target-fuzz"
          key: fuzz-regression
      - run: cargo install --locked cargo-fuzz
      - name: Build every fuzz target
        run: cargo +nightly fuzz build
      - name: Replay seed corpus and fixed-bug regressions
        run: |
          set -euo pipefail
          cd fuzz
          for f in fuzz_targets/*.rs; do
            t=$(basename "$f" .rs)
            dirs=(corpus/seed)
            [ -d "regressions/$t" ] && dirs+=("regressions/$t")
            echo "── replaying $t against: ${dirs[*]}"
            cargo +nightly fuzz run "$t" "${dirs[@]}" -- -runs=0
          done

version = 1

[[annotations]]
path = [
    ".editorconfig",
    ".gitattributes",
    ".gitignore",
    ".rustfmt.toml",
    "Cargo.toml",
    "Cargo.lock",
    "deny.toml",
    "osv-scanner.toml",
    "rust-toolchain.toml",
    "REUSE.toml",
    "supply-chain/audits.toml",
    "supply-chain/config.toml",
    "supply-chain/imports.lock",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Noyalib"
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = ".github/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Noyalib"
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = ["README.md", "CHANGELOG.md", "SECURITY.md", "doc/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Noyalib"
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = "examples/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Noyalib"
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = "tests/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Noyalib"
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = "benches/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Noyalib"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# The release-signing public key. A PGP armored block cannot carry SPDX
# headers without corrupting the armor, so it is annotated here instead.
[[annotations]]
path = "KEYS.asc"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Noyalib"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# ── Fuzz crate scaffolding ────────────────────────────────────────
# The targets themselves carry SPDX headers. These three cannot: a
# .gitignore has no comment convention REUSE recognises, and the two
# Cargo files are regenerated by cargo, which strips added headers.
# The core annotates the same trio the same way.
[[annotations]]
path = [
    "fuzz/.gitignore",
    "fuzz/Cargo.toml",
    "fuzz/Cargo.lock",
    "fuzz/corpus/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Noyalib"
SPDX-License-Identifier = "MIT OR Apache-2.0"

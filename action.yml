#
# noyalib YAML check: format and schema-validate YAML in one step.
#
#   - uses: sebastienrousseau/noya-cli@v0.0.57
#     with:
#       paths: config/ deploy.yaml
#       schema: schema.json          # optional
#
# Downloads the release binaries for the runner's platform and checks
# them before use: the SHA-256 published in the same release (which only
# catches a corrupted download) and, when the gh CLI and a token are
# available (the default on GitHub-hosted runners), the build provenance
# attestation, which proves the archive came from this repository's
# release workflow at the tag of the requested version. Without gh the
# step warns that only the checksum was checked. It then runs
# `noyafmt --check` and, per file, `noyavalidate` (with the schema when
# one is given) over the YAML under `paths`. Either failure fails the
# step. The steps live in scripts/noya-action.sh, which
# scripts/test-action.sh exercises.

name: noyalib YAML check
description: Format-check and schema-validate YAML with noyafmt and noyavalidate.
author: Sebastien Rousseau
branding:
  icon: check-circle
  color: purple

inputs:
  paths:
    description: Files or directories to check, space separated. Directories are searched for *.yaml and *.yml.
    required: false
    default: .
  schema:
    description: A JSON Schema to validate every file against (optional).
    required: false
    default: ""
  version:
    description: The noya-cli release to use, as X.Y.Z. Defaults to the version this action was tagged with.
    required: false
    default: "0.0.57"
  format:
    description: Run noyafmt --check (true or false).
    required: false
    default: "true"
  validate:
    description: Run noyavalidate, with the schema when one is given (true or false).
    required: false
    default: "true"
  token:
    description: Token the gh CLI uses to fetch the release's build attestations (read access to public data is enough).
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Install noya-cli
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ inputs.token }}
      run: '"$GITHUB_ACTION_PATH/scripts/noya-action.sh" install'
    - name: noyafmt --check
      if: ${{ inputs.format == 'true' }}
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
      run: '"$GITHUB_ACTION_PATH/scripts/noya-action.sh" format'
    - name: noyavalidate
      if: ${{ inputs.validate == 'true' }}
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
        SCHEMA: ${{ inputs.schema }}
      run: '"$GITHUB_ACTION_PATH/scripts/noya-action.sh" validate'

[package]
name = "noya-cli-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
clap = { version = "4.5", features = ["derive"] }

[dependencies.noya-cli]
path = ".."

[[bin]]
name = "fuzz_argv"
path = "fuzz_targets/fuzz_argv.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_derive_parse"
path = "fuzz_targets/fuzz_derive_parse.rs"
test = false
doc = false
bench = false

# Pre-release: the parent manifest's git patch, until the cut removes
# both (scripts/verify-release-versions.sh checks this file too).
[patch.crates-io]
noyalib = { git = "https://github.com/sebastienrousseau/noyalib", branch = "feat/v0.0.34" }
